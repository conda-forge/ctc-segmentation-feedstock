{% set name = "ctc-segmentation" %}
{% set version = "1.7.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ctc_segmentation-{{ version }}.tar.gz
  sha256: f6f9c121fac22cc9bf77435c5b0fc1648f06d4498eb0388203314d0bd5170979

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - numpy
    - pip
    - python
  run:
    - python
    - setuptools
    - {{ pin_compatible('numpy') }}

test:
  imports:
    - ctc_segmentation

about:
  home: https://github.com/lumaku/ctc-segmentation
  summary: CTC segmentation to align utterances within large audio files.
  description: CTC segmentation is used to align utterances within audio files. It can be combined with CTC-based ASR models. This package includes the core functions.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - wietsedv
